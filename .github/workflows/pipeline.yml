on:
    push:
        branch: [main]
jobs:
    build:
        runs-on: ubuntu-latest
    
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Setup Nodejs
              uses: actions/setup-node@v3

            - name: Install Dependencies
              uses: npm install

            - name: Run tests
              run: npm tests
        