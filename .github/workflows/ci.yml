name: CI

# Triggers define when this workflow should run
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel previous in-flight runs if new commits are pushed to the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository source code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Bun on the runner
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. Create .env from the committed .env.example template
      # Next.js and Bun automatically read this file without hardcoding secrets in YAML
      - name: Setup environment
        run: cp .env.example .env

      # 4. Install project dependencies.
      # --frozen-lockfile ensures CI fails if bun.lock does not match package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 5. Generate Prisma Client types before type checking and building
      - name: Generate Prisma Client
        run: bunx prisma generate

      # 6. Type-check all TypeScript files
      - name: Run Type Check
        run: bun run typecheck

      # 7. Check code quality rules with ESLint
      - name: Run Linter
        run: bun run lint

      # 8. Execute automated tests using Vitest
      - name: Run Tests
        run: bun run test

      # 9. Verify that Next.js production build succeeds
      - name: Build Next.js Application
        run: bun run build
