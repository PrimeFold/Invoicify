services:
  postgres:
    image: postgres:alpine
    container_name: invoicify-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: invoicify

  redis:
    image: redis:alpine
    container_name: invoicify-redis
    ports:
      - "6379:6379"
