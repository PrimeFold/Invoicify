<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360">

<defs>
  <linearGradient id="violet" x1="40" y1="20" x2="220" y2="250" gradientUnits="userSpaceOnUse">
    <stop stop-color="#A855F7"/>
    <stop offset="1" stop-color="#7C3AED"/>
  </linearGradient>
  <linearGradient id="soft" x1="100" y1="60" x2="360" y2="390" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F5F3FF"/>
  </linearGradient>
</defs>

<g transform="translate(18 24) scale(.74)">

<g>
  <!-- motion lines -->
  <path d="M18 125h88" stroke="#A855F7" stroke-width="12" stroke-linecap="round" opacity=".35"/>
  <path d="M8 155h98" stroke="#7C3AED" stroke-width="10" stroke-linecap="round" opacity=".22"/>
  <path d="M34 185h68" stroke="#7C3AED" stroke-width="9" stroke-linecap="round" opacity=".15"/>

  <!-- invoice body -->
  <path d="M124 54h110l52 52v176c0 16-13 29-29 29H124c-16 0-29-13-29-29V83c0-16 13-29 29-29Z"
        fill="url(#soft)" stroke="#4C1D95" stroke-width="7"/>

  <!-- folded corner -->
  <path d="M234 54v46c0 8 6 14 14 14h38" fill="none" stroke="#4C1D95" stroke-width="7" stroke-linejoin="round"/>

  <!-- ribbon slash -->
  <path d="M86 239L181 67c9-16 24-28 42-35l35-13c18-7 34 11 25 28l-18 34c-6 12-17 22-29 28L133 292c-17 10-39 7-51-8-8-10-8-29 4-45Z"
        fill="url(#violet)"/>
  <path d="M140 217l68-86" stroke="#D8B4FE" stroke-width="12" stroke-linecap="round" opacity=".85"/>

  <!-- invoice lines -->
  <path d="M191 153h48M191 177h68M191 201h46" stroke="#7C3AED" stroke-width="9" stroke-linecap="round"/>

  <!-- rupee -->
  <text x="190" y="249" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="700" fill="#4C1D95">₹</text>

  <!-- growth arrow / check hybrid -->
  <path d="M318 250l32-34 23 19 48-66" fill="none" stroke="#7C3AED" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M413 162l-5 30-22-17" fill="none" stroke="#7C3AED" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</g>

</g>
<text x="430" y="174" font-family="Inter, Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#17111F">Invoic</text>
<text x="760" y="174" font-family="Inter, Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="-4" fill="#7C3AED">ify</text>
<text x="435" y="216" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="6" fill="#6B5B80">BILL · TRACK · GROW</text>
</svg>